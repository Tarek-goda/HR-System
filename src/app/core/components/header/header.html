<header class="w-full h-20 bg-[#e6e6e6] flex items-center justify-between px-8 select-none">
  <!-- Logo -->
  <div class="flex items-center gap-2">
    <h1 class="text-2xl font-black tracking-wider text-[#0052cc]">
      LUMINA <span class="ml-1 text-[#0052cc]">HR</span>
    </h1>
  </div>

  <!-- Search Bar -->
  <div class="relative w-96">
    <div class="flex items-center bg-[#e6e6e6] rounded-full px-4 py-2.5 shadow-[inset_3px_3px_6px_#c5c5c5,inset_-3px_-3px_6px_#ffffff]">
      <svg class="w-5 h-5 text-gray-500 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        placeholder="Search resources..." 
        class="bg-transparent border-none outline-none text-sm text-gray-700 w-full placeholder-gray-400 font-mono"
      />
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-4">
    <!-- Calendar Button -->
    <button class="w-11 h-11 rounded-full bg-[#e6e6e6] flex items-center justify-center text-[#0052cc] shadow-[4px_4px_8px_#c5c5c5,-4px_-4px_8px_#ffffff] active:shadow-[inset_2px_2px_5px_#c5c5c5,inset_-2px_-2px_5px_#ffffff] transition-all">
      <svg class="w-5 h-5 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </button>

    <!-- Notification Button -->
    <button class="w-11 h-11 rounded-full bg-[#e6e6e6] flex items-center justify-center text-[#0052cc] shadow-[4px_4px_8px_#c5c5c5,-4px_-4px_8px_#ffffff] active:shadow-[inset_2px_2px_5px_#c5c5c5,inset_-2px_-2px_5px_#ffffff] transition-all">
      <svg class="w-5 h-5 block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>

    <!-- User Avatar -->
    <div class="w-11 h-11 rounded-full p-0.5 bg-[#e6e6e6] shadow-[4px_4px_8px_#c5c5c5,-4px_-4px_8px_#ffffff] cursor-pointer overflow-hidden">
      <img src="https://i.pravatar.cc/100?img=12" alt="User Avatar" class="w-full h-full rounded-full object-cover" />
    </div>
  </div>
</header>
