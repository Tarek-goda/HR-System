<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[100]">
  <div class="bg-white rounded-3xl p-6 w-[340px] text-center">
    <h3 class="font-bold text-gray-800 mb-4">اضبط وضع الصورة</h3>

    <canvas
      #canvas
      class="mx-auto rounded-full border-4 border-blue-600 cursor-move touch-none"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointerleave)="onPointerUp()"
    ></canvas>

    <div class="mt-4">
      <label class="text-xs text-gray-500 block mb-1">تكبير</label>
      <input type="range" min="1" [max]="zoom() * 3" step="0.01"
             [value]="zoom()"
             (input)="onZoomChange($any($event.target).value)"
             class="w-full">
    </div>

    <div class="flex gap-3 mt-4">
      <button (click)="onCancel()"
              class="flex-1 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl">
        إلغاء
      </button>
      <button (click)="onSave()"
              class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl">
        حفظ
      </button>
    </div>
  </div>
</div>
