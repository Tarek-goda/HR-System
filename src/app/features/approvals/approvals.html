<!-- features/approvals/approvals.html -->
<div class="max-w-2xl mx-auto space-y-4">
  <h2 class="text-xl font-bold text-gray-900">طلبات تعديل المسمى الوظيفي</h2>

  @if (isLoading()) {
    <p class="text-gray-500">جاري التحميل...</p>
  } @else if (requests().length === 0) {
    <p class="text-gray-500">لا توجد طلبات معلقة</p>
  } @else {
    @for (r of requests(); track r.id) {
      <div class="bg-white p-5 rounded-2xl shadow flex items-center justify-between">
        <div>
          <p class="font-bold text-gray-800">{{ r.target_name }}</p>
          <p class="text-sm text-gray-500">{{ r.old_value || '—' }} ← {{ r.new_value }}</p>
        </div>
        <div class="flex gap-2">
          <button (click)="approve(r)" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-bold">قبول</button>
          <button (click)="reject(r.id)" class="px-4 py-2 bg-red-100 text-red-700 rounded-xl text-sm font-bold">رفض</button>
        </div>
      </div>
    }
  }
</div>
