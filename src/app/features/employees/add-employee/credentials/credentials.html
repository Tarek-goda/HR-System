<div
  class="bg-[#e6e6e6] p-8 rounded-3xl shadow-[8px_8px_16px_#c5c5c5,-8px_-8px_16px_#ffffff] max-w-2xl mx-auto border-t-4 border-blue-600"
>
  <div class="flex items-center gap-3 mb-6 text-gray-800 font-bold text-xl tracking-wide">
    <span>Account Security Setup</span>
  </div>

  @if (errorMessage) {
    <div class="bg-red-100 text-red-700 p-3 rounded text-sm mb-4">{{ errorMessage }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5 font-mono text-sm">
    <div>
      <label class="block text-gray-600 mb-2 font-bold">Work Email (Login Username)</label>
      <input
        type="email"
        formControlName="email"
        placeholder="j.sterling@company.com"
        class="w-full bg-[#f0f0f0] text-gray-700 pl-4 pr-4 py-3 rounded-xl shadow-[inset_3px_3px_6px_#d1d1d1,inset_-3px_-3px_6px_#ffffff] outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-gray-600 mb-2 font-bold">Temporary Password</label>
      <div class="relative">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••••••"
          class="w-full bg-[#f0f0f0] text-gray-700 pl-4 pr-12 py-3 rounded-xl shadow-[inset_3px_3px_6px_#d1d1d1,inset_-3px_-3px_6px_#ffffff] outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
        >
          @if (showPassword) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"
              />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>
          }
        </button>
      </div>
    </div>

    <div>
      <label class="block text-gray-600 mb-2 font-bold">Confirm Password</label>
      <div class="relative">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="••••••••••••"
          class="w-full bg-[#f0f0f0] text-gray-700 pl-4 pr-12 py-3 rounded-xl shadow-[inset_3px_3px_6px_#d1d1d1,inset_-3px_-3px_6px_#ffffff] outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          type="button"
          (click)="toggleConfirmPasswordVisibility()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
        >
          @if (showConfirmPassword) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"
              />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>
          }
        </button>
      </div>
      @if (form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched) {
        <p class="text-red-500 text-xs mt-1">Passwords do not match</p>
      }
    </div>

    <div class="pt-4 flex justify-between">
      <button
        type="button"
        (click)="onBack()"
        class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-6 py-3 rounded-xl shadow-[4px_4px_8px_#c5c5c5,-4px_-4px_8px_#ffffff] transition-all"
      >
        Back
      </button>
      <button
        type="submit"
        [disabled]="isSubmitting"
        class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow-[4px_4px_8px_#c5c5c5,-4px_-4px_8px_#ffffff] flex items-center gap-2 transition-all disabled:opacity-50"
      >
        <span>{{ isSubmitting ? 'Creating...' : 'Complete Onboarding' }}</span>
      </button>
    </div>
  </form>
</div>
